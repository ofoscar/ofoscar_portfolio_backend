name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: ofoscar
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ofoscar_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U ofoscar -d ofoscar_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: test-secret-key-that-is-at-least-32-bytes
      ADMIN_EMAIL: test@example.com
      ADMIN_PASSWORD_HASH: test

      DATABASE_URL: postgresql+psycopg2://ofoscar:testpassword@localhost:5432/ofoscar_test

      AWS_REGION: us-east-2
      S3_BUCKET_NAME: test-bucket
      S3_PUBLIC_URL: https://test-bucket.s3.us-east-2.amazonaws.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  build-image:
      needs: test
      runs-on: ubuntu-latest

      if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Log in to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push Docker image
          uses: docker/build-push-action@v7
          with:
            context: .
            platforms: linux/amd64,linux/arm64
            push: true
            tags: |
              ghcr.io/${{ github.repository_owner }}/ofoscar-portfolio-backend:latest
              ghcr.io/${{ github.repository_owner }}/ofoscar-portfolio-backend:${{ github.sha }}

  deploy:
    needs: build-image
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Deploy to EC2 with SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio backend ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/ofoscar-backend",
              "docker compose pull",
              "docker compose run --rm api alembic upgrade head",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

  