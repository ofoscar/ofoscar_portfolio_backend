name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret-key-that-is-at-least-32-bytes
      ADMIN_EMAIL: test@example.com
      ADMIN_PASSWORD_HASH: test
      DATABASE_URL: sqlite:///./test.db
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test
      MINIO_BUCKET: test
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: http://localhost:9000

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v7

      - name: Install uv
      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

build-image:
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ofoscar-portfolio-backend:latest
            ghcr.io/${{ github.repository_owner }}/ofoscar-portfolio-backend:${{ github.sha }}
  