[project]
name = "ofoscar-backend"
version = "0.1.0"
description = "ofoscar admin backend"
readme = "README.md"
authors = [
    { name = "ofoscar", email = "me@ofoscar.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pytest>=9.1.1",
]

[project.scripts]
ofoscar-backend = "ofoscar_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
