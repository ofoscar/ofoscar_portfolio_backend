[project]
name = "ofoscar-backend"
version = "0.1.0"
description = "ofoscar admin backend"
readme = "README.md"
authors = [
    { name = "ofoscar", email = "me@ofoscar.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
ofoscar-backend = "ofoscar_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
